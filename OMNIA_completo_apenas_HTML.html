<!doctype html>
<!-- OMINIA standalone: HTML + CSS + JavaScript + imagens incorporadas em um único arquivo. -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OMNIA — Inteligência de Reuniões</title>
  <style>
:root{
  --bg:#061426;--bg2:#071a31;--panel:#0b203a;--panel2:#0d2747;--line:#17375f;
  --text:#f2f7ff;--muted:#8fa6c4;--blue:#0c82ff;--blue2:#20a4ff;--cyan:#56d7ff;
  --green:#22cc88;--yellow:#f4b83a;--red:#ff5d65;--purple:#9d78ff;
  --shadow:0 20px 60px rgba(0,0,0,.25);--radius:16px;
}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at 70% 10%,#0a2b55 0,#061426 30%,#04101f 70%);color:var(--text)}
button,input,select,textarea{font:inherit}.app-shell{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:24px 20px;background:rgba(3,15,30,.95);border-right:1px solid rgba(115,164,225,.12);display:flex;flex-direction:column}.brand{display:flex;gap:12px;align-items:center;background:none;border:0;color:var(--text);padding:0 10px 24px;cursor:pointer;text-align:left}.brand-mark{width:44px;height:44px;border-radius:50%;background:white;display:grid;place-items:center}.brand-mark span{width:22px;height:22px;border:4px solid #123b6b;border-radius:6px;transform:rotate(45deg)}.brand strong{font-size:24px;letter-spacing:.8px}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.nav{display:flex;flex-direction:column;gap:6px}.nav-item{height:48px;border:0;border-radius:10px;background:transparent;color:#b8c7da;text-align:left;padding:0 14px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:.2s}.nav-item:hover{background:#0a2648;color:#fff}.nav-item.active{background:linear-gradient(90deg,#0c3d77,#0b2c58);color:#4fb3ff}.ico{width:20px;text-align:center;font-size:19px}.plan-card{margin-top:auto;border:1px solid var(--line);background:rgba(12,30,53,.7);border-radius:14px;padding:18px}.plan-card strong,.plan-card small{display:block}.plan-card small{color:var(--muted);margin:12px 0 8px}.progress{height:8px;border-radius:8px;background:#102c4d;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#087cff,#29b1ff);border-radius:8px}.ghost-btn{width:100%;margin-top:12px;padding:9px;border:1px solid var(--line);border-radius:8px;background:#0a2340;color:#46a9ff;cursor:pointer}.workspace{min-width:0}.topbar{height:92px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:1px solid rgba(115,164,225,.1);position:sticky;top:0;background:rgba(4,16,31,.86);backdrop-filter:blur(18px);z-index:20}.search-wrap{width:min(560px,48vw);height:46px;border:1px solid var(--line);background:#06182c;border-radius:11px;display:flex;align-items:center;padding:0 14px;gap:10px}.search-wrap input{flex:1;background:transparent;border:0;outline:0;color:white}.search-wrap kbd{color:#8da5c2;border:1px solid #1b3c63;border-radius:6px;padding:3px 7px;font-size:11px}.top-actions{display:flex;align-items:center;gap:10px}.icon-btn{width:38px;height:38px;border:0;background:transparent;color:#b9cae1;font-size:20px;position:relative;cursor:pointer}.badge{position:absolute;right:0;top:-2px;background:#167cff;color:white;border-radius:20px;font-size:10px;padding:2px 5px}.profile-btn{display:flex;align-items:center;gap:10px;background:none;border:0;color:white;cursor:pointer}.profile-btn small{display:block;color:var(--muted);text-align:left}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#0c82ff,#41c5ff);display:grid;place-items:center;font-weight:800}.main{padding:30px 34px 56px;max-width:1700px;margin:0 auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.page-head h1{font-size:32px;margin:0}.page-head p{color:var(--muted);margin:6px 0 0}.blue{color:#2e9dff}.primary-btn{background:linear-gradient(180deg,#0d8cff,#056be3);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;box-shadow:0 8px 22px rgba(7,123,255,.25)}.secondary-btn{background:#0b2340;color:#cce4ff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}.card{background:linear-gradient(180deg,rgba(13,36,65,.92),rgba(7,25,46,.94));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.upload-card{min-height:350px;border-color:#0f63b9;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}.upload-card:before{content:"";position:absolute;inset:auto -15% -30% -15%;height:58%;background:radial-gradient(ellipse at center,rgba(0,148,255,.28),transparent 58%),repeating-radial-gradient(ellipse at center,rgba(0,168,255,.14) 0 1px,transparent 1px 7px);filter:blur(.2px);transform:skewY(-4deg)}.upload-card>*{position:relative;z-index:1}.upload-icon{width:76px;height:76px;border-radius:50%;background:#0b376b;display:grid;place-items:center;font-size:36px;color:#58b8ff;margin-bottom:16px}.upload-card h2{font-size:30px;margin:0 0 8px}.upload-card p{color:#a8b9d2;margin:4px}.drop-active{outline:2px dashed #35b6ff;outline-offset:-8px}.flow-strip{margin-top:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px}.flow-step{display:flex;gap:13px;align-items:flex-start;padding:10px}.flow-num{width:40px;height:40px;border-radius:10px;background:#102e54;display:grid;place-items:center;color:#54b7ff;font-weight:800}.flow-step b{display:block;color:#9bcaff;margin-bottom:4px}.flow-step small{color:#8fa6c4;line-height:1.5}.section-title{display:flex;justify-content:space-between;align-items:center;margin:30px 0 14px}.section-title h2{margin:0;font-size:22px}.link-btn{border:0;background:transparent;color:#32a8ff;cursor:pointer}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse}.data-table th,.data-table td{padding:15px 16px;border-bottom:1px solid rgba(116,165,224,.12);text-align:left}.data-table th{color:#7088a7;font-size:12px;text-transform:uppercase;letter-spacing:.07em}.data-table tr:hover td{background:#0b2440}.status{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}.status.done{background:rgba(34,204,136,.12);color:#3be09b}.status.progressing{background:rgba(12,130,255,.14);color:#56b2ff}.status.pending{background:rgba(244,184,58,.12);color:#ffc45e}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.metric{padding:20px}.metric label{color:#a9b9cd;font-size:13px}.metric strong{display:block;font-size:30px;margin:12px 0 6px}.metric small{color:#7892b1}.mini-line{height:60px;width:100%;margin-top:10px}.meeting-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(380px,.95fr);gap:18px}.transcript{padding:20px}.meeting-tabs{display:flex;gap:22px;border-bottom:1px solid rgba(116,165,224,.15);margin:-20px -20px 18px;padding:0 20px}.meeting-tabs button{border:0;background:transparent;color:#9fb2ca;padding:16px 0;cursor:pointer}.meeting-tabs button.active{color:#2f9dff;border-bottom:2px solid #2f9dff}.speaker-row{margin:18px 0 22px}.time{color:#2da0ff;font-weight:700;margin-right:14px}.speaker{font-weight:700;color:#dce8f8}.speaker-row p{color:#a8b9cf;line-height:1.65;margin:10px 0}.highlight{color:#2f9dff;text-decoration:underline;text-decoration-color:#1e66a9}.analysis-side{display:flex;flex-direction:column;gap:14px}.analysis-card{padding:20px}.analysis-card h3{margin:0 0 14px}.analysis-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.analysis-kpi{background:#0d2a4b;border-radius:10px;padding:14px}.analysis-kpi small{color:#8da5c4}.analysis-kpi b{display:block;margin-top:10px;font-size:22px}.good{color:#23d494}.warn{color:#ffb538}.score{color:#46a9ff}.list-clean{list-style:none;padding:0;margin:0}.list-clean li{padding:10px 0;border-bottom:1px solid rgba(116,165,224,.1);display:flex;justify-content:space-between;gap:12px}.pill{display:inline-block;padding:5px 9px;border-radius:7px;background:#0b315c;color:#42aaff;font-size:12px;margin:3px}.chat-hero{text-align:center;padding:24px 10px 20px}.nabu{width:110px;height:110px;object-fit:cover;border-radius:50%;filter:drop-shadow(0 8px 18px rgba(33,144,255,.35))}.suggestions{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0 28px}.suggestion{border:1px solid var(--line);background:#0a213d;color:#cfe0f3;border-radius:12px;padding:18px;text-align:left;cursor:pointer;min-height:76px}.chat{display:flex;flex-direction:column;gap:16px;max-width:1200px;margin:0 auto}.msg{display:flex;gap:14px;align-items:flex-start}.msg.user{justify-content:flex-end}.bubble{max-width:70%;padding:15px 18px;border-radius:12px;background:#102640;color:#cddbee;line-height:1.55}.msg.user .bubble{background:#0a3c79;color:#dcecff}.chat-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover}.composer{display:flex;gap:10px;margin-top:16px;background:#0b2038;border:1px solid var(--line);border-radius:12px;padding:10px}.composer input{flex:1;border:0;outline:0;background:transparent;color:white;padding:0 10px}.composer button{width:48px;height:48px;border:0;border-radius:9px;background:#0a82ff;color:white;font-size:20px;cursor:pointer}.dashboard-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1.35fr;gap:14px}.span-2{grid-column:span 2}.dash-card{padding:18px;min-height:180px}.dash-card h3{margin:0 0 14px;font-size:15px}.big-num{font-size:30px;font-weight:800}.delta{font-size:12px;color:#61beff}.gauge{width:120px;height:70px;border-radius:120px 120px 0 0;background:conic-gradient(from 270deg,#0a88ff 0 76%,#173555 76% 100%);position:relative;margin:18px auto 0;overflow:hidden}.gauge:after{content:"";position:absolute;left:18px;right:18px;bottom:0;height:52px;background:#0a203a;border-radius:80px 80px 0 0}.gauge span{position:absolute;z-index:1;left:0;right:0;bottom:6px;text-align:center;font-size:26px;font-weight:800}.bar-list{display:flex;align-items:flex-end;gap:16px;height:110px;padding:10px 8px 0}.bar{flex:1;background:linear-gradient(180deg,#179dff,#0871da);border-radius:5px 5px 0 0;min-width:16px;position:relative}.bar small{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:11px;color:#aabbd0}.line-chart{height:150px;position:relative;border-left:1px solid #244568;border-bottom:1px solid #244568;margin-top:14px;background:repeating-linear-gradient(to bottom,transparent 0 29px,rgba(110,159,216,.08) 30px)}.line-chart svg{width:100%;height:100%;overflow:visible}.progress-row{margin:12px 0}.progress-row div{display:flex;justify-content:space-between;font-size:13px;color:#b8c8dc;margin-bottom:6px}.progress-row i{display:block;height:5px;background:#102f52;border-radius:5px;overflow:hidden}.progress-row i:after{content:"";display:block;height:100%;width:var(--p);background:#0b8fff}.empty-page{padding:40px}.cards-list{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.info-card{padding:20px}.info-card h3{margin-top:0}.info-card p{color:#9eb1ca;line-height:1.55}.tag{font-size:12px;color:#5db9ff;border:1px solid #194d7e;border-radius:999px;padding:4px 8px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:16px}.setting-card{padding:20px}.setting-row{display:flex;justify-content:space-between;align-items:center;margin:14px 0}.switch{width:48px;height:26px;border-radius:999px;background:#153658;padding:3px;cursor:pointer}.switch i{display:block;width:20px;height:20px;background:#7e97b5;border-radius:50%;transition:.2s}.switch.on{background:#0a75e8}.switch.on i{transform:translateX(22px);background:white}.toast{position:fixed;right:28px;bottom:28px;background:#0f2d50;border:1px solid #22558a;color:#dff1ff;border-radius:12px;padding:14px 18px;transform:translateY(30px);opacity:0;pointer-events:none;transition:.25s;z-index:100}.toast.show{transform:none;opacity:1}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;z-index:90}.modal{width:min(560px,92vw);background:#081a2e;border:1px solid #205086;border-radius:16px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.55)}.modal h2{margin-top:0}.field{display:grid;gap:7px;margin:14px 0}.field label{color:#a9bbcf;font-size:13px}.field input,.field textarea,.field select{background:#061426;border:1px solid var(--line);border-radius:9px;color:white;padding:11px;outline:0}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.loader{width:26px;height:26px;border:3px solid #17426d;border-top-color:#2ea9ff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:1100px){.app-shell{grid-template-columns:86px 1fr}.sidebar{padding:18px 12px}.brand div:last-child,.nav-item:not(.active){font-size:0}.nav-item{justify-content:center;padding:0}.nav-item.active{font-size:0}.ico{font-size:22px}.plan-card{display:none}.brand{justify-content:center}.brand-mark{width:42px}.topbar{padding:0 18px}.meeting-layout{grid-template-columns:1fr}.grid-4,.dashboard-grid{grid-template-columns:1fr 1fr}.suggestions{grid-template-columns:1fr 1fr}.cards-list{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.app-shell{grid-template-columns:1fr}.sidebar{position:fixed;bottom:0;top:auto;left:0;right:0;width:100%;height:64px;z-index:60;display:block;padding:8px;background:#04101f}.brand,.plan-card{display:none}.nav{flex-direction:row;overflow-x:auto}.nav-item{min-width:58px;height:48px}.nav-item:nth-child(n+6){display:none}.workspace{padding-bottom:70px}.topbar{height:70px}.profile-btn span:nth-child(2),.search-wrap kbd{display:none}.search-wrap{width:100%}.main{padding:20px 14px}.flow-strip,.grid-3,.grid-4,.dashboard-grid,.cards-list,.settings{grid-template-columns:1fr}.span-2{grid-column:auto}.suggestions{grid-template-columns:1fr}.analysis-grid{grid-template-columns:1fr}.upload-card{min-height:290px}.meeting-layout{grid-template-columns:1fr}.bubble{max-width:88%}}

</style>
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <button class="brand" data-route="home" aria-label="Ir para início">
        <div class="brand-mark"><span></span></div>
        <div><strong>OMNIA</strong><small>Inteligência de Reuniões</small></div>
      </button>

      <nav class="nav" aria-label="Navegação principal">
        <button class="nav-item active" data-route="home"><span class="ico">⌂</span>Início</button>
        <button class="nav-item" data-route="meetings"><span class="ico">▣</span>Reuniões</button>
        <button class="nav-item" data-route="insights"><span class="ico">◉</span>Insights</button>
        <button class="nav-item" data-route="dashboard"><span class="ico">▥</span>Dashboards</button>
        <button class="nav-item" data-route="clients"><span class="ico">♙</span>Clientes</button>
        <button class="nav-item" data-route="opportunities"><span class="ico">◎</span>Oportunidades</button>
        <button class="nav-item" data-route="risks"><span class="ico">◇</span>Riscos</button>
        <button class="nav-item" data-route="reports"><span class="ico">▤</span>Relatórios</button>
        <button class="nav-item" data-route="ai"><span class="ico">✦</span>AI Copilot</button>
        <button class="nav-item" data-route="settings"><span class="ico">⚙</span>Configurações</button>
      </nav>

      <div class="plan-card">
        <strong>Plano Corporativo</strong>
        <small>Usuários ativos: <b>24/50</b></small>
        <div class="progress"><i style="width:48%"></i></div>
        <button class="ghost-btn">Gerenciar plano ↗</button>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div class="search-wrap">
          <span>⌕</span>
          <input id="globalSearch" type="search" placeholder="Buscar reuniões, clientes, tópicos..." />
          <kbd>⌘ K</kbd>
        </div>
        <div class="top-actions">
          <button class="icon-btn" title="Notificações">♢<span class="badge">3</span></button>
          <button class="icon-btn" title="Ajuda">?</button>
          <button class="profile-btn">
            <span class="avatar">RA</span>
            <span><b>Ricardo Almeida</b><small>Administrador</small></span>
            <span>⌄</span>
          </button>
        </div>
      </header>
      <main id="main" class="main"></main>
    </section>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <div id="modalRoot"></div>
  <script>
const state = {
  route: 'home',
  uploadedMeetings: [],
  compact: false,
  meeting: {
    title: 'Reunião com TechSolutions', date: '15/05/2025', duration: '1:24:36',
    transcript: [
      ['00:02:15','Ana Souza (TechSolutions)','Agradeço a presença de todos. Queremos discutir nossa experiência com os módulos atuais e explorar oportunidades para expandir nosso uso da plataforma.'],
      ['00:03:47','Carlos Mendes (TechSolutions)','No geral, estamos satisfeitos com o ERP Financeiro e o módulo de Compras. No entanto, enfrentamos alguns desafios na integração com nosso CRM.'],
      ['00:05:21','Juliana Lima (OMNIA)','Entendo. A integração com CRM realmente é um ponto sensível para alguns clientes. Podemos apresentar nossa solução de integração nativa, que já ajudou empresas como a de vocês.'],
      ['00:07:10','Ana Souza (TechSolutions)','Seria ótimo. Outro ponto importante: estamos avaliando expandir o uso para o módulo de CRM, especialmente para melhorar nosso relacionamento com clientes e pipeline comercial.'],
      ['00:08:32','Ricardo Almeida (OMNIA)','Perfeito. Com o módulo de CRM, vocês terão uma visão 360° dos clientes, além de automações que podem aumentar a produtividade do time comercial.'],
      ['00:10:05','Carlos Mendes (TechSolutions)','Também temos interesse em entender melhor os dashboards e análises gerenciais. Precisamos de mais visibilidade para tomada de decisão estratégica.']
    ]
  }
};
const main = document.querySelector('#main');
const toast = document.querySelector('#toast');
const modalRoot = document.querySelector('#modalRoot');

const meetingRows = [
  ['TechSolutions','15/05/2025','Concluída','7 insights'],
  ['Cliente ABC','14/05/2025','Concluída','5 insights'],
  ['Cliente XYZ','13/05/2025','Em análise','—'],
  ['Alinhamento interno','12/05/2025','Concluída','4 insights']
];

function setRoute(route){
  state.route = route;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.route===route));
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('click',e=>{
  const route = e.target.closest('[data-route]')?.dataset.route;
  if(route) setRoute(route);
});

document.querySelector('#globalSearch').addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target.value.trim()){
    showToast(`Busca por “${e.target.value.trim()}” concluída: 6 resultados encontrados.`);
  }
});

document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){
    e.preventDefault(); document.querySelector('#globalSearch').focus();
  }
});

function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2800)}

function spark(points,color='#168eff'){
  return `<svg viewBox="0 0 200 60" preserveAspectRatio="none"><polyline fill="none" stroke="${color}" stroke-width="4" points="${points}" /></svg>`
}

function pageHead(title,subtitle,action=''){
  return `<div class="page-head"><div><h1>${title}</h1><p>${subtitle}</p></div>${action}</div>`
}

function home(){
  const rows=[...state.uploadedMeetings.map(x=>[x,'Hoje','Em análise','—']),...meetingRows];
  return `${pageHead('Bem-vindo ao <span class="blue">OMNIA</span>','Sua inteligência para transformar conversas em resultados.','<button class="primary-btn" id="newMeeting">＋ Nova reunião</button>')}
    <section class="card upload-card" id="dropzone">
      <div class="upload-icon">☁</div><h2>Faça upload da sua reunião</h2>
      <p>Arraste e solte o arquivo aqui ou clique para selecionar</p><p>Formatos suportados: TXT, PDF, DOCX, CSV • Tamanho máximo: 50MB</p>
      <input id="fileInput" type="file" hidden accept=".txt,.pdf,.docx,.csv" />
      <button class="primary-btn" id="selectFile" style="margin-top:22px">⇧ &nbsp; Selecionar arquivo</button>
    </section>
    <section class="card flow-strip">
      ${[['1. Upload','Envie a transcrição da reunião'],['2. Análise IA','Nossa IA analisa os conteúdos e contextos'],['3. Insights','Identificamos padrões, oportunidades e riscos'],['4. Dashboard','Visualize insights e tome decisões melhores']].map((s,i)=>`<div class="flow-step"><div class="flow-num">${i+1}</div><div><b>${s[0]}</b><small>${s[1]}</small></div></div>`).join('')}
    </section>
    <div class="section-title"><h2>Reuniões recentes</h2><button class="link-btn" data-route="meetings">Ver todas</button></div>
    <section class="card table-wrap"><table class="data-table"><thead><tr><th>Reunião</th><th>Data</th><th>Status</th><th>Insights</th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr class="meeting-row" data-open-meeting="1"><td><b>${r[0]}</b></td><td>${r[1]}</td><td><span class="status ${r[2]==='Concluída'?'done':r[2]==='Em análise'?'progressing':'pending'}">${r[2]}</span></td><td>${r[3]}</td></tr>`).join('')}
    </tbody></table></section>`;
}

function meetings(){
  const t=state.meeting.transcript;
  return `${pageHead('← &nbsp; '+state.meeting.title, 'Data: '+state.meeting.date+' &nbsp; • &nbsp; Duração: '+state.meeting.duration, '<button class="secondary-btn" id="shareBtn">↗ Compartilhar</button>')}
  <div class="meeting-layout">

function render(){
  const routes={home,meetings,insights,dashboard,clients,opportunities,risks,reports,ai,settings};
  main.innerHTML=(routes[state.route]||home)();
  bindPageEvents();
}

function bindPageEvents(){
  const select=document.querySelector('#selectFile'), input=document.querySelector('#fileInput'), drop=document.querySelector('#dropzone');
  if(select) select.onclick=()=>input.click();
  if(input) input.onchange=()=>input.files[0]&&processUpload(input.files[0]);
  if(drop){
    ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drop-active')}));
    ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drop-active')}));
    drop.addEventListener('drop',e=>e.dataTransfer.files[0]&&processUpload(e.dataTransfer.files[0]));
  }
  document.querySelector('#newMeeting')?.addEventListener('click',openNewMeetingModal);
  document.querySelectorAll('[data-open-meeting]').forEach(r=>r.onclick=()=>setRoute('meetings'));
  document.querySelector('#shareBtn')?.addEventListener('click',()=>navigator.clipboard?.writeText(location.href).then(()=>showToast('Link da reunião copiado.')).catch(()=>showToast('Reunião pronta para compartilhar.')));
  document.querySelector('#filterTranscript')?.addEventListener('click',()=>showToast('Filtro de transcrição ativado. Digite um termo na busca superior.'));
  document.querySelectorAll('[data-question]').forEach(b=>b.onclick=()=>sendQuestion(b.dataset.question));
  document.querySelector('#sendChat')?.addEventListener('click',()=>{const i=document.querySelector('#chatInput');if(i.value.trim())sendQuestion(i.value.trim())});
  document.querySelector('#chatInput')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim())sendQuestion(e.target.value.trim())});
  document.querySelectorAll('[data-generic-action]').forEach(b=>b.onclick=()=>showToast('Detalhes carregados no protótipo.'));
  document.querySelector('#exportReport')?.addEventListener('click',exportReport);
  document.querySelector('#compactSwitch')?.addEventListener('click',e=>{state.compact=!state.compact;e.currentTarget.classList.toggle('on',state.compact);document.documentElement.style.setProperty('--radius',state.compact?'10px':'16px');showToast('Preferência salva.');});
}

function processUpload(file){
  if(file.size>50*1024*1024){showToast('Arquivo maior que 50MB.');return}
  showToast(`Enviando ${file.name}...`);
  setTimeout(()=>{state.uploadedMeetings.unshift(file.name.replace(/\.[^.]+$/,''));showToast('Upload concluído. A análise de IA foi iniciada.');render();},1000)
}
function openNewMeetingModal(){
  modalRoot.innerHTML=`<div class="modal-backdrop"><div class="modal"><h2>Nova reunião</h2><div class="field"><label>Nome da reunião</label><input id="meetingName" value="Reunião com novo cliente"></div><div class="field"><label>Cliente</label><input id="clientName" placeholder="Nome do cliente"></div><div class="field"><label>Observações</label><textarea rows="4" placeholder="Contexto opcional para a análise"></textarea></div><div class="modal-actions"><button class="secondary-btn" id="cancelModal">Cancelar</button><button class="primary-btn" id="createMeeting">Criar reunião</button></div></div></div>`;
  document.querySelector('#cancelModal').onclick=()=>modalRoot.innerHTML='';
  document.querySelector('#createMeeting').onclick=()=>{const n=document.querySelector('#meetingName').value.trim()||'Nova reunião';state.uploadedMeetings.unshift(n);modalRoot.innerHTML='';render();showToast('Reunião criada. Você já pode enviar a transcrição.');};
}
function sendQuestion(q){
  if(state.route!=='ai'){setRoute('ai');setTimeout(()=>sendQuestion(q),0);return}

function answerFor(q){const s=q.toLowerCase();if(s.includes('churn'))return 'Identifiquei 5 clientes com maior risco de churn nesta semana. O principal fator recorrente é queda de engajamento combinada a chamados abertos. Posso detalhar as contas e os próximos passos recomendados.';if(s.includes('upsell')||s.includes('oportun'))return 'Encontrei 8 oportunidades de upsell com alta probabilidade de conversão. As três principais somam aproximadamente R$ 200 mil em valor potencial, com destaque para CRM, integração e analytics.';if(s.includes('resum'))return 'Nesta semana, os tópicos mais recorrentes foram integração com CRM, dashboards gerenciais, produtividade comercial e expansão de módulos. Também houve aumento de menções a dificuldades de integração.';if(s.includes('interesse'))return 'Os principais interesses identificados são integração com CRM, expansão de módulos, dashboards gerenciais, visão 360° do cliente e automação de tarefas comerciais.';return 'Analisei o contexto disponível. Posso cruzar reuniões, clientes, riscos, oportunidades e recomendações para responder com mais precisão. Tente perguntar sobre churn, upsell, tópicos recorrentes ou interesses dos clientes.'}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}
function exportReport(){const csv='Relatorio,Valor\nRiscos em aberto,8\nOportunidades,12\nReunioes analisadas,23\n';const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='omnia-relatorio.csv';a.click();URL.revokeObjectURL(a.href);showToast('Relatório exportado.');}
